name: Supabase Keepalive

# O plano gratuito do Supabase pausa o projeto após 7 dias sem atividade
# suficiente. Uma chamada diária isolada não bastou (aviso de pausa recebido
# em 06/10/2026), então este workflow roda a cada 6 horas e, além de chamar
# registrar_acesso() (escrita), lê uma camada pelo export_geojson, simulando
# o uso real do site. Desde 21/10/2026 as obras ficam no schema siplaweb, só
# com login, então a leitura sem login usa a camada pública de aeródromos.
on:
  schedule:
    # A cada 6 horas, no minuto 17 (evita o pico de filas do GitHub na hora cheia).
    - cron: '17 */6 * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar registrar_acesso() e ler uma camada no Supabase
        env:
          # Chaves públicas ("publishable"): não são segredo (o banco protege com login + RLS).
          # O mesmo arquivo roda nos dois repositórios: SIPLAWEB (produção, banco-gis-dpl) e
          # SIPLAWEB_HOMOLOG (homologação, banco-gis-homolog). Ambos em São Paulo.
          REPOSITORIO: ${{ github.repository }}
        run: |
          if [ "${REPOSITORIO##*/}" = "SIPLAWEB_HOMOLOG" ]; then
            URL="https://lbhgjkhpxhihmuzapxui.supabase.co"; CHAVE="sb_publishable_HzhId9FCLmFz_TQrmoU2NQ_qJFEandU"
          else
            URL="https://zeneqnnrlrmmmejchbrl.supabase.co"; CHAVE="sb_publishable_U8n8H8rjvsT8zTpQfZf1dQ_XtV8seBI"
          fi
          echo "Banco: $URL"
          curl -sf -X POST "$URL/rest/v1/rpc/registrar_acesso"             -H "apikey: $CHAVE" -H "Authorization: Bearer $CHAVE" -H "Content-Type: application/json" -d '{}'
          echo "registrar_acesso(): ok"
          curl -sf -o /dev/null -X POST "$URL/rest/v1/rpc/export_geojson"             -H "apikey: $CHAVE" -H "Authorization: Bearer $CHAVE" -H "Content-Type: application/json" -d '{"p_table":"aero"}'
          echo "Leitura da camada aero: ok"
