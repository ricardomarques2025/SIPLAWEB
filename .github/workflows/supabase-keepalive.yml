name: Supabase Keepalive

# O plano gratuito do Supabase pausa o projeto após 7 dias sem atividade
# suficiente. Uma chamada diária isolada não bastou (aviso de pausa recebido
# em 06/10/2026), então este workflow roda a cada 6 horas e, além de chamar
# registrar_acesso() (escrita), lê uma camada pelo export_geojson, simulando
# o uso real do site. Desde 21/10/2026 as obras ficam no schema siplaweb, só
# com login, então a leitura sem login usa a camada pública de aeródromos.
on:
  schedule:
    # A cada 6 horas, no minuto 17 (evita o pico de filas do GitHub na hora cheia).
    - cron: '17 */6 * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar registrar_acesso() e ler uma camada no Supabase
        env:
          # Chave pública ("publishable") do projeto banco-gis-dpl (São Paulo,
          # desde 26/10/2026; antes banco-gis, em Oregon). Não é um segredo
          # (protegida por RLS no banco), por isso fica direto aqui em vez
          # de exigir configurar um secret.
          SUPABASE_ANON_KEY: "sb_publishable_U8n8H8rjvsT8zTpQfZf1dQ_XtV8seBI"
        run: |
          curl -sf -X POST "https://zeneqnnrlrmmmejchbrl.supabase.co/rest/v1/rpc/registrar_acesso" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}'
          echo "registrar_acesso(): ok"
          curl -sf -o /dev/null -X POST "https://zeneqnnrlrmmmejchbrl.supabase.co/rest/v1/rpc/export_geojson" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"p_table":"aero"}'
          echo "Leitura da camada aero: ok"
