name: Supabase Keepalive

# O plano gratuito do Supabase pausa o projeto após 7 dias sem atividade
# suficiente. Uma chamada diária isolada não bastou (aviso de pausa recebido
# em 06/10/2026), então este workflow roda a cada 6 horas e, além de chamar
# registrar_acesso() (escrita), lê as tabelas dados e obras_links, simulando
# o uso real do site.
on:
  schedule:
    # A cada 6 horas, no minuto 17 (evita o pico de filas do GitHub na hora cheia).
    - cron: '17 */6 * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar registrar_acesso() e ler tabelas no Supabase
        env:
          # Chave "anon" pública do projeto banco-gis (a mesma usada pelo
          # site quando ele lia os dados do Supabase). Não é um segredo
          # (protegida por RLS no banco), por isso fica direto aqui em vez
          # de exigir configurar um secret.
          SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0dWthYW5lbGNzZXZkbW9xbHlzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNDE0NTIsImV4cCI6MjEwMjcxNzQ1Mn0.WgEoQ4FEGTOuTrWtDN07eGc6huKWP5QD7Bt44GPeq4o"
        run: |
          curl -sf -X POST "https://ctukaanelcsevdmoqlys.supabase.co/rest/v1/rpc/registrar_acesso" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}'
          echo "registrar_acesso(): ok"
          for tabela in dados obras_links; do
            curl -sf -o /dev/null "https://ctukaanelcsevdmoqlys.supabase.co/rest/v1/${tabela}?select=*&limit=100" \
              -H "apikey: ${SUPABASE_ANON_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_ANON_KEY}"
            echo "Leitura de ${tabela}: ok"
          done
